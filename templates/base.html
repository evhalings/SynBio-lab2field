<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}From Lab to Field{% endblock %}</title>

  <!-- Fonts: Big Shoulders Display (headings), Karla (body), Yellowtail (script).
       preconnect warms up the connection to Google before the CSS asks for fonts.
       display=swap shows fallback text immediately instead of blank text. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700;800&family=Karla:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Yellowtail&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ base_url }}/static/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="{{ base_url }}/index.html">From Lab to Field</a>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Supported by NSF SynBAS NRT Training Grant No. 2021900.
         Northwestern Center for Synthetic Biology · Engineers Without Borders Chicagoland Professional Chapter</p>
    </div>
  </footer>
</body>
</html>
