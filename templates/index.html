{% extends "base.html" %}
{% block content %}
<p class="kicker">A field guide for two perspectives</p>
<h1><span class="script">From lab</span><br>to field</h1>
<div class="rule"></div>
<p>How synthetic biology can serve global development.</p>

<h2>Case studies</h2>
{% for s in studies %}

    <p>{{ s.summary }}</p>
  </article>
{% endfor %}
{% endblock %}
